<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet"
    >

    <title>Dashboard - Household Expiration Tracker</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Menu -->
    <aside class="menu">
        <h1>Expiration Tracker</h1>

        <nav>
            <a href="dashboard.html">DASHBOARD</a>
            <a href="inventory.html">INVENTORY</a>
            <a href="profile.html">PROFILE</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div>
                <h2>Dashboard</h2>
                <p>Overview of your household items.</p>
            </div>
        </header>

        <!-- Expiration Status Counters -->
        <section class="status-section">

            <div class="status-card good">
                <h3>Good</h3>
                <p id="good-count">0</p>
                <span>31+ days</span>
            </div>

            <div class="status-card soon">
                <h3>Soon</h3>
                <p id="soon-count">0</p>
                <span>16–30 days</span>
            </div>

            <div class="status-card urgent">
                <h3>Urgent</h3>
                <p id="urgent-count">0</p>
                <span>8–15 days</span>
            </div>

            <div class="status-card critical">
                <h3>Critical</h3>
                <p id="critical-count">0</p>
                <span>1–7 days</span>
            </div>

            <div class="status-card expired">
                <h3>Expired</h3>
                <p id="expired-count">0</p>
                <span>0 or fewer days</span>
            </div>

        </section>

        <!-- Items Needing Attention -->
        <section class="attention-section">
            <h2>Items Needing Attention</h2>

            <div class="item-list" id="attention-list"></div>

        </section>

    </main>

    <script src="../js/script.js"></script>

</body>

</html>
